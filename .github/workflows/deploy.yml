name: Deploy YangYang.fun

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Confirm deployment to yangyang.fun"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: yangyang-fun-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirm_deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate site files
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -s site/index.html
          echo "Files prepared for deployment:"
          find site -type f -not -path '*/.DS_Store' -print

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" || { echo "Missing repository secret: DEPLOY_SSH_KEY"; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "Missing repository secret: DEPLOY_KNOWN_HOSTS"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Check deployment account and directory
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo "Missing repository secret: DEPLOY_HOST"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "Missing repository secret: DEPLOY_USER"; exit 1; }
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'test -d /www/wwwroot/yangyang.fun && test -w /www/wwwroot/yangyang.fun'

      - name: Sync site files to Nginx root
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude='.well-known/' \
            --exclude='.user.ini' \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            site/ "$DEPLOY_USER@$DEPLOY_HOST:/www/wwwroot/yangyang.fun/"

      - name: Verify deployment
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'test -s /www/wwwroot/yangyang.fun/index.html'
          curl --fail --silent --show-error --head https://yangyang.fun/
